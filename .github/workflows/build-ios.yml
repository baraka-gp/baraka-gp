name: Compiler et envoyer l'app iOS (TestFlight)

on:
  push:
    branches: [claude/new-session-rtyzv8]
    paths:
      - '.github/workflows/build-ios.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances npm (Capacitor)
        run: npm ci

      - name: Préparer les fichiers web et synchroniser le projet iOS
        run: npm run ios:sync

      - name: Installer Fastlane
        run: gem install fastlane -N

      - name: Compiler et envoyer sur TestFlight
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # macos-15 a plusieurs versions d'Xcode installées ; la 16.4 est
          # celle sélectionnée par défaut, mais Apple exige depuis peu le SDK
          # iOS 26 (Xcode 26+) pour toute soumission à l'App Store (run #20).
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: fastlane testflight
