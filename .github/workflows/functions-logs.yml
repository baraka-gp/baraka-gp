name: Journaux des Cloud Functions (diagnostic)

on:
  push:
    branches: [claude/new-session-rtyzv8]
    paths:
      - '.github/workflows/functions-logs.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Fonctions à inspecter (séparées par des virgules)'
        required: false
        default: 'notifyUserMessage,notifyOrderMessage,notifyNewOrder,notifyOrderAccepted'
      lines:
        description: 'Nombre de lignes de log'
        required: false
        default: '50'
      admin_email:
        description: 'Email à déclarer admin (laisser vide pour ne rien faire)'
        required: false
      fetch_apple_pay_file:
        description: 'Récupérer le fichier de vérification de domaine Apple Pay (oui/non)'
        required: false
      register_apple_pay_domain:
        description: 'Domaine à déclarer pour Apple Pay auprès de Stripe (laisser vide pour ne rien faire)'
        required: false
      check_stripe_account:
        description: 'Vérifier le statut du compte plateforme Stripe (oui/non)'
        required: false
      set_business_name:
        description: 'Nom à définir comme business_profile.name sur Stripe (laisser vide pour ne rien faire)'
        required: false
      fix_connected_accounts_profile:
        description: 'Corriger le profil d activite des comptes Stripe voyageurs existants (oui/non)'
        required: false
      check_connected_accounts:
        description: 'Verifier le statut (paiements actives, virements actives, pieces manquantes) des comptes Stripe voyageurs existants (oui/non)'
        required: false
      check_webhook_endpoints:
        description: 'Lister les webhooks Stripe enregistrés et leurs évènements écoutés (oui/non)'
        required: false
      fix_profile_onboarded:
        description: 'Numéro (format Firestore, ex 0749392022) dont le profil doit être marqué stripeOnboarded=true manuellement (laisser vide pour ne rien faire)'
        required: false

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Firebase CLI
        run: npm install -g firebase-tools

      - name: Authentification Google (compte de service)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Afficher les journaux récents
        if: inputs.functions != ''
        run: firebase functions:log --project baraka-gp --only "${{ inputs.functions }}" -n "${{ inputs.lines }}"

      - name: Inspecter Firestore (comptes et jetons push)
        if: inputs.functions == ''
        run: |
          npm install firebase-admin@12
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'baraka-gp' });
            const db = admin.firestore();
            const cleanPhone = p => (p || '').replace(/[^0-9]/g, '');
            (async () => {
              const snap = await db.collection('accounts').get();
              console.log('Comptes trouvés :', snap.size);
              let fixed = 0;
              for (const doc of snap.docs) {
                const d = doc.data();
                const computed = cleanPhone(d.phone);
                console.log('---');
                console.log('uid:', doc.id, '| name:', d.name, '| phone:', d.phone, '| phoneClean actuel:', d.phoneClean, '| fcmTokens:', (d.fcmTokens || []).length);
                if (!d.phoneClean && computed) {
                  await doc.ref.set({ phoneClean: computed }, { merge: true });
                  console.log('  -> corrigé : phoneClean =', computed);
                  fixed++;
                }
              }
              console.log('Comptes corrigés :', fixed);
              const msgSnap = await db.collection('messages').get();
              console.log('=== Threads messages ===');
              msgSnap.forEach(doc => {
                const d = doc.data();
                console.log(doc.id, '| name:', d.name, '| thread length:', (d.thread||[]).length, '| last from:', d.thread && d.thread.length ? d.thread[d.thread.length-1].from : null);
              });
            })().catch(e => { console.error('ERREUR:', e.message); process.exit(1); });
          "

      - name: Déclarer un compte admin
        if: inputs.admin_email != ''
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          npm install firebase-admin@12
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'baraka-gp' });
            (async () => {
              const user = await admin.auth().getUserByEmail(process.env.ADMIN_EMAIL);
              console.log('Compte trouvé : uid =', user.uid, '| email =', user.email);
              await admin.firestore().collection('admins').doc(user.uid).set({ role: 'admin' });
              console.log('-> Déclaré admin avec succès (collection admins, doc', user.uid + ')');
            })().catch(e => { console.error('ERREUR:', e.message); process.exit(1); });
          "

      - name: Récupérer le fichier de vérification Apple Pay (Stripe)
        if: inputs.fetch_apple_pay_file != ''
        run: |
          set -e
          URL="https://stripe.com/files/apple-pay/apple-developer-merchantid-domain-association"
          echo "Téléchargement depuis $URL"
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/apple-pay-file -L "$URL")
          echo "Code HTTP : $HTTP_CODE"
          echo "Taille : $(wc -c < /tmp/apple-pay-file) octets"
          head -c 300 /tmp/apple-pay-file
          echo ""

      - name: Déclarer le domaine Apple Pay auprès de Stripe
        if: inputs.register_apple_pay_domain != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DOMAIN: ${{ inputs.register_apple_pay_domain }}
        run: |
          set -e
          curl -sS https://api.stripe.com/v1/apple_pay/domains \
            -u "$STRIPE_SECRET_KEY:" \
            -d "domain_name=$DOMAIN"
          echo ""

      - name: Vérifier le statut du compte plateforme Stripe
        if: inputs.check_stripe_account != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -e
          curl -sS https://api.stripe.com/v1/account -u "$STRIPE_SECRET_KEY:" -o /tmp/stripe-account.json
          echo "=== Compte plateforme (/v1/account) ==="
          jq '{id, charges_enabled, payouts_enabled, details_submitted, requirements, capabilities, controller, type, business_profile, payout_schedule: .settings.payouts}' /tmp/stripe-account.json

      - name: Définir le nom de l'entreprise sur Stripe
        if: inputs.set_business_name != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BUSINESS_NAME: ${{ inputs.set_business_name }}
        run: |
          set -e
          curl -sS https://api.stripe.com/v1/account \
            -u "$STRIPE_SECRET_KEY:" \
            --data-urlencode "business_profile[name]=$BUSINESS_NAME" \
            -o /tmp/stripe-account-updated.json
          echo "=== Résultat ==="
          jq '{id, business_profile}' /tmp/stripe-account-updated.json
          echo "=== Réponse brute (debug) ==="
          cat /tmp/stripe-account-updated.json

      - name: Corriger le profil d'activité des comptes Stripe voyageurs existants
        if: inputs.fix_connected_accounts_profile != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -e
          npm install firebase-admin@12
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'baraka-gp' });
            (async () => {
              const snap = await admin.firestore().collection('profiles').get();
              const ids = [];
              snap.forEach(doc => { const d = doc.data(); if (d.stripeAccountId) ids.push(d.stripeAccountId); });
              require('fs').writeFileSync('/tmp/account-ids.txt', ids.join('\n') + '\n');
              console.log('Comptes Stripe trouvés :', ids.length);
            })().catch(e => { console.error('ERREUR:', e.message); process.exit(1); });
          "
          while IFS= read -r ACCT; do
            [ -z "$ACCT" ] && continue
            echo "Mise à jour de $ACCT"
            curl -sS https://api.stripe.com/v1/accounts/$ACCT \
              -u "$STRIPE_SECRET_KEY:" \
              --data-urlencode "business_profile[product_description]=Transport de colis entre particuliers via l'application Baraka GP" \
              --data-urlencode "business_profile[mcc]=4789" \
              -o /tmp/update-$ACCT.json
            jq '{id, business_profile}' /tmp/update-$ACCT.json
            echo "--- Réponse brute (debug) ---"
            cat /tmp/update-$ACCT.json
          done < /tmp/account-ids.txt

      - name: Vérifier le statut des comptes Stripe voyageurs existants
        if: inputs.check_connected_accounts != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -e
          npm install firebase-admin@12
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'baraka-gp' });
            (async () => {
              const snap = await admin.firestore().collection('profiles').get();
              const rows = [];
              snap.forEach(doc => { const d = doc.data(); if (d.stripeAccountId) rows.push({ phone: doc.id, name: d.name, accountId: d.stripeAccountId, stripeOnboarded: d.stripeOnboarded || false }); });
              require('fs').writeFileSync('/tmp/accounts.json', JSON.stringify(rows));
              console.log('Comptes Stripe trouvés :', rows.length);
            })().catch(e => { console.error('ERREUR:', e.message); process.exit(1); });
          "
          node -e "
            const rows = JSON.parse(require('fs').readFileSync('/tmp/accounts.json', 'utf8'));
            require('fs').writeFileSync('/tmp/accounts.txt', rows.map(r => [r.phone, r.accountId, r.name, r.stripeOnboarded].join('|')).join('\n') + '\n');
          "
          while IFS='|' read -r PHONE ACCT NAME ONBOARDED; do
            [ -z "$ACCT" ] && continue
            echo "=== $NAME ($PHONE) — $ACCT — profils.stripeOnboarded=$ONBOARDED ==="
            curl -sS https://api.stripe.com/v1/accounts/$ACCT -u "$STRIPE_SECRET_KEY:" -o /tmp/acct-$ACCT.json
            jq '{id, charges_enabled, payouts_enabled, details_submitted, requirements: {currently_due, disabled_reason}, payout_schedule: .settings.payouts}' /tmp/acct-$ACCT.json
            echo "--- Solde (disponible / en attente) ---"
            curl -sS https://api.stripe.com/v1/balance -u "$STRIPE_SECRET_KEY:" -H "Stripe-Account: $ACCT" -o /tmp/bal-$ACCT.json
            jq '{available, pending}' /tmp/bal-$ACCT.json
            echo "--- Virements externes (cartes/IBAN) ---"
            curl -sS "https://api.stripe.com/v1/accounts/$ACCT/external_accounts" -u "$STRIPE_SECRET_KEY:" -o /tmp/ext-$ACCT.json
            jq '.data[] | {object, id, default_for_currency, available_payout_methods: (.available_payout_methods // null)}' /tmp/ext-$ACCT.json
          done < /tmp/accounts.txt

      - name: Lister les webhooks Stripe enregistrés
        if: inputs.check_webhook_endpoints != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -e
          curl -sS https://api.stripe.com/v1/webhook_endpoints -u "$STRIPE_SECRET_KEY:" -o /tmp/webhooks.json
          jq '.data[] | {id, url, status, enabled_events}' /tmp/webhooks.json

      - name: Corriger manuellement stripeOnboarded sur un profil
        if: inputs.fix_profile_onboarded != ''
        env:
          PHONE: ${{ inputs.fix_profile_onboarded }}
        run: |
          set -e
          npm install firebase-admin@12
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'baraka-gp' });
            (async () => {
              const ref = admin.firestore().collection('profiles').doc(process.env.PHONE);
              const snap = await ref.get();
              if (!snap.exists) { console.error('Profil introuvable pour', process.env.PHONE); process.exit(1); }
              await ref.set({ stripeOnboarded: true }, { merge: true });
              console.log('stripeOnboarded mis à true pour', process.env.PHONE);
            })().catch(e => { console.error('ERREUR:', e.message); process.exit(1); });
          "
